name: Update JS dependencies
description: >-
  Updates direct JS dependencies with npm-check-updates (major bumps included), refreshes the lockfile
  (pnpm-lock.yaml when present, yarn.lock otherwise), then opens or refreshes a PR. Run after
  actions/checkout (fetch-depth: 0) and whatever installs node, the package manager and the registry
  auth your repo needs. Pins live in the repo's .ncurc.js.

inputs:
  github-token:
    description: Token used to push the branch and open the PR (needs contents and pull-requests write)
    required: true
  packages:
    description: Comma separated npm-check-updates --filter globs. Empty updates everything
    required: false
    default: ""
  workspaces:
    description: '"true" to also update the root and every workspace package.json (yarn or pnpm workspaces)'
    required: false
    default: "false"
  cooldown:
    description: Minimum age of a package version or Node release before it is adopted, e.g. 7d, 12h (default 7d, 0 disables). Newly published versions are the likeliest to be compromised
    required: false
    default: ""
  node-files:
    description: Whitespace separated globs of files whose Node version moves to the latest LTS, Dockerfile (FROM node:), .nvmrc and .tool-versions (default Dockerfile .nvmrc .tool-versions)
    required: false
    default: ""
  pr-branch:
    description: Branch the update is pushed to (default chore/update-dependencies-js)
    required: false
    default: ""
  pr-title:
    description: 'PR title (default "chore(deps): weekly JS dependency update")'
    required: false
    default: ""
  pr-labels:
    description: Comma separated PR labels (default dependencies,javascript)
    required: false
    default: ""
  base-branch:
    description: PR target branch (default main)
    required: false
    default: ""

outputs:
  updated:
    description: '"true" if a PR was created or refreshed'
    value: ${{ steps.create-pr.outputs.updated }}
  pr-url:
    description: URL of the created or refreshed PR
    value: ${{ steps.create-pr.outputs.pr-url }}

runs:
  using: composite
  steps:
    - name: Update Node version
      shell: bash
      env:
        NODE_FILES: ${{ inputs.node-files || 'Dockerfile .nvmrc .tool-versions' }}
        COOLDOWN: ${{ inputs.cooldown || '7d' }}
      run: bash "${{ github.action_path }}/bin/update-node"

    - name: Update dependencies
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        WORKSPACES: ${{ inputs.workspaces }}
        COOLDOWN: ${{ inputs.cooldown || '7d' }}
      run: bash "${{ github.action_path }}/bin/update-deps"

    - name: Create PR
      id: create-pr
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        # Inputs fall back with || because callers forward empty strings (e.g. workflow_dispatch inputs)
        PR_FILES: package.json packages/*/package.json yarn.lock pnpm-lock.yaml ${{ inputs.node-files || 'Dockerfile .nvmrc .tool-versions' }}
        PR_DIFF_EXCLUDE: yarn.lock pnpm-lock.yaml
        PR_BRANCH: ${{ inputs.pr-branch || 'chore/update-dependencies-js' }}
        PR_TITLE: "${{ inputs.pr-title || 'chore(deps): weekly JS dependency update' }}"
        PR_COMMIT_MESSAGE: "chore(deps): update JS dependencies"
        PR_BODY_HEADING: JS dependency updates
        PR_BODY_INTRO: >-
          Direct dependencies were updated to their latest version that is at least the cooldown
          old (default 7 days), including major versions, and Node was moved to the latest LTS.
          Check CI and review the diff for breaking changes before merging.
        PR_LABELS: ${{ inputs.pr-labels || 'dependencies,javascript' }}
        BASE_BRANCH: ${{ inputs.base-branch || 'main' }}
      run: bash "${{ github.action_path }}/../lib/create-pr"
