name: Update Go dependencies
description: >-
  Updates direct Go dependencies and the Go version (go.mod, Dockerfile, .tool-versions),
  then opens or refreshes a PR. Run after actions/checkout (fetch-depth: 0) and actions/setup-go.

inputs:
  github-token:
    description: Token used to push the branch and open the PR (needs contents and pull-requests write)
    required: true
  pinned-deps:
    description: Whitespace separated module paths to keep at their current version
    required: false
    default: ""
  pr-branch:
    description: Branch the update is pushed to (default chore/update-dependencies-go)
    required: false
    default: ""
  pr-title:
    description: 'PR title (default "chore(deps): weekly Go dependency update")'
    required: false
    default: ""
  pr-labels:
    description: Comma separated PR labels (default dependencies,go)
    required: false
    default: ""
  base-branch:
    description: PR target branch (default main)
    required: false
    default: ""
  working-directory:
    description: Directory holding go.mod and the Dockerfile, relative to the repo root (default .), for monorepos with one module per directory
    required: false
    default: ""
  workspace-directory:
    description: Directory holding go.work and a shared .tool-versions, relative to the repo root (default none). Their Go version is raised, never lowered, with each module's update
    required: false
    default: ""

outputs:
  updated:
    description: '"true" if a PR was created or refreshed'
    value: ${{ steps.create-pr.outputs.updated }}
  pr-url:
    description: URL of the created or refreshed PR
    value: ${{ steps.create-pr.outputs.pr-url }}

runs:
  using: composite
  steps:
    - name: Detect Go version
      id: detect-go-version
      shell: bash
      working-directory: ${{ inputs.working-directory || '.' }}
      run: bash "${{ github.action_path }}/bin/detect-go-version"

    - name: Resolve workspace files
      id: workspace
      shell: bash
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        WORKSPACE_DIRECTORY: ${{ inputs.workspace-directory }}
      run: |
        if [[ -n "$WORKSPACE_DIRECTORY" ]]; then
          dir=$(realpath "${GITHUB_WORKSPACE}/${WORKSPACE_DIRECTORY}")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "files=$(realpath --relative-to=. "$dir/go.work") $(realpath --relative-to=. "$dir/.tool-versions")" >> "$GITHUB_OUTPUT"
        fi

    - name: Update dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        NEEDS_GO_UPDATE: ${{ steps.detect-go-version.outputs.needs_go_update }}
        LATEST_GO_FULL: ${{ steps.detect-go-version.outputs.latest_go_full }}
        PINNED_DEPS: ${{ inputs.pinned-deps }}
        WORKSPACE_DIR: ${{ steps.workspace.outputs.dir }}
        # actions/setup-go pins GOTOOLCHAIN=local to the version resolved from go.mod, so once
        # this step bumps the go directive to a newer version, `go` needs GOTOOLCHAIN=auto to
        # download and switch to that toolchain itself rather than erroring out.
        GOTOOLCHAIN: auto
      run: bash "${{ github.action_path }}/bin/update-deps"

    - name: Create PR
      id: create-pr
      shell: bash
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        # Inputs fall back with || because callers forward empty strings (e.g. workflow_dispatch inputs)
        PR_FILES: go.mod go.sum Dockerfile .tool-versions ${{ steps.workspace.outputs.files }}
        PR_DIFF_EXCLUDE: go.sum
        PR_BRANCH: ${{ inputs.pr-branch || 'chore/update-dependencies-go' }}
        PR_TITLE: "${{ inputs.pr-title || 'chore(deps): weekly Go dependency update' }}"
        PR_COMMIT_MESSAGE: "chore(deps): update Go dependencies"
        PR_BODY_HEADING: Go dependency updates
        PR_LABELS: ${{ inputs.pr-labels || 'dependencies,go' }}
        BASE_BRANCH: ${{ inputs.base-branch || 'main' }}
      run: bash "${{ github.action_path }}/../lib/create-pr"
